name: Windows build

# Produces the single NOLSniper.exe to hand to a Windows machine, plus the
# manifest the running app checks for updates. Both are attached to a Release on
# a tag, so the download link is stable.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r mac/requirements.txt
          pip install pyinstaller pytest

      # A build that ships a failing test suite is worse than no build: the whole
      # point of the exe is that whoever runs it cannot debug it.
      - name: Test on Windows
        run: python -m pytest tests/ -q

      # Both are read by app_update at runtime and bundled by the spec. They are
      # written before the build so the exe knows its own version and where to
      # look for newer automation.
      - name: Stamp version and update source
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/v?','' } else { "0.0.0+$($env:GITHUB_SHA.Substring(0,7))" }
          Set-Content -NoNewline -Encoding utf8 VERSION $version
          Set-Content -NoNewline -Encoding utf8 UPDATE_URL "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/manifest.json"
          Write-Host "version $version"

      # Drawn from the same source as the macOS .icns, in pure Python — the
      # macOS pipeline needs sips and iconutil, which do not exist here.
      - name: Draw the icon
        run: python tools/make_ico.py

      - name: Build
        run: pyinstaller nolsniper.spec --noconfirm

      # The exe is what people actually run, and PyInstaller silently omitting a
      # hidden import — cdp, websocket, chrome_host are all reached by name, so
      # nothing static references them — only shows up at launch, on someone
      # else's machine, as a window that never appears. Run the real artifact
      # with the real flag and require it to get far enough to report health.
      - name: Smoke the built exe's Chrome host
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'exe_state.json'
          '{}' | Set-Content -Encoding utf8 $state
          $health = Join-Path (Split-Path $state) '.nolsniper_bridge_health.json'
          Remove-Item $health -ErrorAction SilentlyContinue
          $p = Start-Process -PassThru -FilePath dist\NOLSniper.exe `
                 -ArgumentList '--chrome-host',$state `
                 -RedirectStandardOutput exe_out.log -RedirectStandardError exe_err.log
          $ok = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if (Test-Path $health) { $ok = $true; break }
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host '=== stdout ==='; if (Test-Path exe_out.log) { Get-Content exe_out.log -Raw }
          Write-Host '=== stderr ==='; if (Test-Path exe_err.log) { Get-Content exe_err.log -Raw }
          Write-Host '=== startup breadcrumbs ==='
          $trail = Join-Path $env:LOCALAPPDATA 'NOLSniper\startup.log'
          if (Test-Path $trail) { Get-Content $trail -Raw } else { Write-Host '(absent)' }
          if (-not $ok) { throw 'the built exe never wrote bridge health with --chrome-host' }
          Write-Host '=== bridge health ==='; Get-Content $health -Raw

      - name: Write the update manifest
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw
          $sha = (Get-FileHash -Algorithm SHA256 browser/nolsniper_autopilot.js).Hash.ToLower()
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
          @{
            app_version      = $version
            releases_url     = "https://github.com/$env:GITHUB_REPOSITORY/releases"
            autopilot_sha256 = $sha
            autopilot_url    = "$base/nolsniper_autopilot.js"
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/manifest.json
          Copy-Item browser/nolsniper_autopilot.js dist/nolsniper_autopilot.js

      - uses: actions/upload-artifact@v4
        with:
          name: NOLSniper-windows
          path: |
            dist/NOLSniper.exe
            dist/manifest.json
            dist/nolsniper_autopilot.js

      # On a tag these become the stable download links the app checks against.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOLSniper.exe
            dist/manifest.json
            dist/nolsniper_autopilot.js
